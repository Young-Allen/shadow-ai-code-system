
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30天过期
    session:
      cookie:
        max-age: 2592000


spring:
  application:
    name: shadow-ai-code-backend

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_shadow?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 522166

  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600

  #session配置
  session:
    store-type: redis
    # session 30天过期
    timeout: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.shadow.aicodingsystem.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

#AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-0f96007674e64f59849b37c8868f5a27
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: sk-0f96007674e64f59849b37c8868f5a27
      model-name: deepseek-chat
      max-tokens: 32768
      log-requests: true
      log-responses: true
